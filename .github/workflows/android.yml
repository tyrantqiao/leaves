name: Android APK
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish signed APK to GitHub Release
        type: boolean
        default: false
  push:
    branches: ['main']
    tags: ['android-v*']
    paths: ['apps/android/**', 'apps/desktop-prototype/**', 'scripts/prepare-android-release.cjs', '.github/workflows/android.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle -p apps/android assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Leaves-Android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
  release:
    if: startsWith(github.ref, 'refs/tags/android-v') || inputs.publish == true
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LEAVES_ANDROID_KEYSTORE: ${{ github.workspace }}/release.jks
      LEAVES_ANDROID_STORE_PASSWORD: ${{ secrets.LEAVES_ANDROID_STORE_PASSWORD }}
      LEAVES_ANDROID_KEY_PASSWORD: ${{ secrets.LEAVES_ANDROID_KEY_PASSWORD }}
      LEAVES_ANDROID_KEY_ALIAS: ${{ secrets.LEAVES_ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.LEAVES_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$LEAVES_ANDROID_STORE_PASSWORD"
          test -n "$LEAVES_ANDROID_KEY_PASSWORD"
          test -n "$LEAVES_ANDROID_KEY_ALIAS"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$LEAVES_ANDROID_KEYSTORE"
      - run: gradle -p apps/android assembleRelease lintRelease
      - name: Prepare update manifest
        run: |
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            node scripts/prepare-android-release.cjs "$GITHUB_REF_NAME"
          else
            node scripts/prepare-android-release.cjs
          fi
      - name: Publish signed update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(node -p "require('./exports/android-release/leaves-android-update.json').tag")
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release exists; preserving published assets"
            exit 0
          fi
          gh release create "$tag" exports/android-release/Leaves-Android.apk exports/android-release/leaves-android-update.json --draft --target "$GITHUB_SHA" --title "Leaves Android ${tag#android-v}" --notes "Android signed release. Local-first storage and optional two-way sync. Updates require Android installer confirmation."
          gh release edit "$tag" --draft=false --latest
      - name: Remove signing key
        if: always()
        run: rm -f "$LEAVES_ANDROID_KEYSTORE"
