<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Leaves</title>
    <link rel="stylesheet" href="./styles.css">
    <!-- Leaflet 本地优先：离线也能运行；加载失败时由 app.js 自动降级到 CDN -->
    <link rel="stylesheet" href="./vendor/leaflet/leaflet.css">
    <script src="./vendor/leaflet/leaflet.js"></script>
    <!-- 离线矢量底图数据（中国省级边界），以 script 方式加载以兼容 file:// 双击打开 -->
    <script src="./vendor/china-provinces.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="Leaves">
          <div class="brand-mark">L</div>
          <strong>Leaves</strong>
        </div>
        <form id="quickAddForm" class="quick-add" aria-label="快速登记">
          <label class="input-label" for="tripInput">行程输入</label>
          <input id="tripInput" name="tripInput" autocomplete="off" placeholder="输入航班号 / 车次号 / 路线，如 CA1234、G1234、上海虹桥 到 杭州东">
          <label class="input-label" for="tripMode">交通方式</label>
          <select id="tripMode" name="tripMode" title="交通方式（默认自动识别）">
            <option value="auto" selected>自动</option>
            <option value="flight">航班</option>
            <option value="rail">铁路</option>
            <option value="ship">轮船</option>
            <option value="road">道路</option>
          </select>
          <label class="input-label" for="tripDate">日期</label>
          <input id="tripDate" name="tripDate" type="date">
          <button class="primary-button" type="submit">登记</button>
        </form>
        <div class="top-actions">
          <button class="ghost-button small export-json" type="button">导出</button>
          <button class="ghost-button small import-json" type="button">导入</button>
        </div>
      </header>

      <main class="main">
        <section id="heroCard" class="hero-card" aria-label="当前行程">
          <div class="map-canvas">
            <div id="leafletMap" class="leaflet-map" aria-label="行程地图"></div>
            <div id="mapFallback" class="map-fallback" hidden>
              <strong>地图资源未加载</strong>
              <span>正在加载本地地图资源，若长时间空白请强制刷新（Ctrl+F5）。</span>
            </div>
          </div>
          <div id="heroOverlay" class="hero-overlay"></div>
        </section>

        <section class="bottom-panel" aria-label="行程列表">
          <div class="bottom-toolbar">
            <div class="segmented" role="group" aria-label="交通方式筛选">
              <button class="segment active" data-filter="all" type="button">全部</button>
              <button class="segment" data-filter="flight" type="button">飞行</button>
              <button class="segment" data-filter="rail" type="button">铁路</button>
              <button class="segment" data-filter="ship" type="button">轮船</button>
              <button class="segment" data-filter="road" type="button">道路</button>
            </div>
            <span id="tileSourceLabel" class="tile-source"></span>
            <span id="statsLine" class="stats-line"></span>
          </div>
          <div id="tripStrip" class="trip-strip" aria-label="近期行程"></div>
        </section>
      </main>
    </div>
    <input id="importFile" type="file" accept="application/json,.json" hidden>
    <script src="./app.js"></script>
  </body>
</html>
