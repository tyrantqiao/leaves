<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d1418">
    <title>Leaves</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div id="authGate" class="auth-gate">
      <section class="auth-card" aria-labelledby="authTitle">
        <div class="auth-brand">
          <div class="brand-mark">L</div>
          <div>
            <h1 id="authTitle">登录 Leaves</h1>
            <p>每个账号只会看到自己的行程记录。</p>
          </div>
        </div>
        <div class="auth-tabs" role="tablist" aria-label="账号操作">
          <button id="loginTab" class="auth-tab active" data-auth-mode="login" type="button">登录</button>
          <button id="registerTab" class="auth-tab" data-auth-mode="register" type="button">注册</button>
        </div>
        <form id="authForm" class="auth-form">
          <label class="auth-field" for="authUsername">
            <span>账号名</span>
            <input id="authUsername" name="username" autocomplete="username" placeholder="your_name" required>
          </label>
          <label class="auth-field" for="authPassword">
            <span>密码</span>
            <input id="authPassword" name="password" type="password" autocomplete="current-password" required>
          </label>
          <label id="authConfirmRow" class="auth-field" for="authPasswordConfirm" hidden>
            <span>确认密码</span>
            <input id="authPasswordConfirm" name="passwordConfirm" type="password" autocomplete="new-password">
          </label>
          <button id="authSubmit" class="primary-button" type="submit">登录</button>
          <p id="authMessage" class="auth-message" role="status"></p>
        </form>
      </section>
    </div>

    <div id="appShell" class="app-shell" hidden>
      <header class="topbar">
        <div class="brand" aria-label="Leaves">
          <div class="brand-mark">L</div>
          <strong>Leaves</strong>
        </div>
        <nav class="view-tabs" role="tablist" aria-label="页面切换">
          <button id="homeTab" class="view-tab active" data-view="home" type="button" role="tab" aria-selected="true" aria-controls="homeView">行程</button>
          <button id="dashboardTab" class="view-tab" data-view="dashboard" type="button" role="tab" aria-selected="false" aria-controls="dashboardView">看板</button>
          <button id="achievementsTab" class="view-tab" data-view="achievements" type="button" role="tab" aria-selected="false" aria-controls="achievementsView">成就</button>
        </nav>
        <form id="quickAddForm" class="quick-add" aria-label="快速登记">
          <label class="input-label" for="tripInput">行程输入</label>
          <input id="tripInput" name="tripInput" autocomplete="off" placeholder="输入航班号 / 车次号 / 路线，如 CA1234、G1234、上海虹桥 到 杭州东">
          <label class="input-label" for="tripMode">交通方式</label>
          <select id="tripMode" name="tripMode" title="交通方式（默认自动识别）">
            <option value="auto" selected>自动</option>
            <option value="flight">航班</option>
            <option value="rail">铁路</option>
            <option value="ship">轮船</option>
            <option value="road">道路</option>
          </select>
          <label class="input-label" for="tripDate">日期</label>
          <input id="tripDate" name="tripDate" type="date">
          <button class="primary-button" type="submit">识别</button>
        </form>
        <div class="top-actions">
          <div class="user-chip" title="当前账号">
            <span id="currentUserName" class="user-name" title="当前账号"></span>
            <button id="logoutButton" class="ghost-button small" type="button">退出</button>
          </div>
          <button class="ghost-button small export-json" type="button">导出</button>
          <button class="ghost-button small import-json" type="button">导入</button>
        </div>
      </header>

      <main class="main">
        <section id="homeView" class="app-view home-view" data-view-panel="home" role="tabpanel" aria-labelledby="homeTab">
          <section id="heroCard" class="hero-card" aria-label="当前行程">
            <div class="map-canvas">
              <div id="leafletMap" class="leaflet-map" aria-label="行程地图"></div>
              <div id="mapFallback" class="map-fallback" hidden>
                <strong>地图资源未加载</strong>
                <span>正在加载本地地图资源，若长时间空白请强制刷新（Ctrl+F5）。</span>
              </div>
            </div>
            <div id="heroOverlay" class="hero-overlay"></div>
          </section>

          <section class="bottom-panel" aria-label="行程列表">
            <div class="bottom-toolbar">
              <div class="segmented" role="group" aria-label="交通方式筛选">
                <button class="segment active" data-filter="all" type="button">全部</button>
                <button class="segment" data-filter="flight" type="button">飞行</button>
                <button class="segment" data-filter="rail" type="button">铁路</button>
                <button class="segment" data-filter="ship" type="button">轮船</button>
                <button class="segment" data-filter="road" type="button">道路</button>
              </div>
              <span id="tileSourceLabel" class="tile-source"></span>
              <span id="statsLine" class="stats-line"></span>
            </div>
            <div id="tripStrip" class="trip-strip" aria-label="近期行程"></div>
          </section>
        </section>

        <section id="dashboardView" class="app-view dashboard-view" data-view-panel="dashboard" role="tabpanel" aria-labelledby="dashboardTab" hidden>
          <div class="page-head">
            <div>
              <h2>数据看板</h2>
              <p id="dashboardRange">暂无行程数据</p>
            </div>
            <span id="dashboardSummary" class="page-summary">0 km</span>
          </div>

          <div id="dashboardMetricGrid" class="metric-grid" aria-label="核心指标"></div>

          <div class="dashboard-layout">
            <section class="insight-panel" aria-labelledby="modeBreakdownTitle">
              <div class="panel-head">
                <h3 id="modeBreakdownTitle">方式分布</h3>
                <span id="modeDominant"></span>
              </div>
              <div id="modeBreakdown" class="mode-breakdown"></div>
            </section>

            <section class="insight-panel" aria-labelledby="monthlyTimelineTitle">
              <div class="panel-head">
                <h3 id="monthlyTimelineTitle">月份走势</h3>
                <span>近 6 个月</span>
              </div>
              <div id="monthlyTimeline" class="timeline-bars"></div>
            </section>

            <section class="insight-panel" aria-labelledby="topRoutesTitle">
              <div class="panel-head">
                <h3 id="topRoutesTitle">高频路线</h3>
                <span id="routeCountLabel">0 条</span>
              </div>
              <div id="topRoutesList" class="rank-list"></div>
            </section>

            <section class="insight-panel" aria-labelledby="recentHighlightsTitle">
              <div class="panel-head">
                <h3 id="recentHighlightsTitle">最近动态</h3>
                <span id="recentCountLabel">0 条</span>
              </div>
              <div id="recentHighlights" class="rank-list"></div>
            </section>
          </div>
        </section>

        <section id="achievementsView" class="app-view achievements-view" data-view-panel="achievements" role="tabpanel" aria-labelledby="achievementsTab" hidden>
          <div class="page-head">
            <div>
              <h2>成就系统</h2>
              <p id="achievementSummary">0 / 0 已解锁</p>
            </div>
            <span id="achievementLevel" class="page-summary">Lv. 0</span>
          </div>
          <div id="achievementProgress" class="achievement-progress" aria-label="成就进度"></div>
          <div id="achievementGrid" class="achievement-grid" aria-label="成就列表"></div>
        </section>
      </main>
    </div>
    <input id="importFile" type="file" accept="application/json,.json" hidden>
    <script src="./airport-data.js" defer></script>
    <script src="./app.js" defer></script>
  </body>
</html>
