server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name leaves.tyrantqiao.com _;

    client_max_body_size 4m;

    access_log /var/log/nginx/leaves.access.log;
    error_log /var/log/nginx/leaves.error.log;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name leaves.tyrantqiao.com _;

    ssl_certificate /etc/ssl/certs/leaves-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/leaves-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 4m;

    access_log /var/log/nginx/leaves.ssl.access.log;
    error_log /var/log/nginx/leaves.ssl.error.log;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
